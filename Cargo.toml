[package]
name = "yourls-tray-app"
version = "1.3.1"
edition = "2024"


[lints.clippy]
pedantic = { level = "warn", priority = -1 }
too_many_lines = "warn"
unwrap_used = "warn"

[lints.rust]
unsafe_code = "warn"

# The binary is `yourls`: it is a URL shortener that happens to also have a
# tray, rather than a tray app that happens to shorten. The tray is opt-in,
# behind --tray.
[[bin]]
name = "yourls"
path = "src/main.rs"

# The tray is a feature so that `--no-default-features` builds a pure CLI.
#
# It is worth the bother because the tray drags in the whole GTK,
# appindicator and libxdo stack, and those are linked at load time: without
# this, `yourls https://example.com` on a headless machine fails to start
# before it can print anything. With it, a CLI-only build has no GUI
# dependency at all.
#
# Default-on, because a desktop install wants the tray and should not have to
# ask for it.
[features]
default = ["tray"]
tray = [
    "dep:tray-icon",
    "dep:gtk",
    "dep:glib",
    "dep:arboard",
    "dep:clipboard-master",
    "dep:notify-rust",
    "dep:device_query",
    "dep:single-instance",
    "dep:crossbeam-channel",
    "dep:serde_json",
]

[dependencies]
# Needed by every build: configuration, logging and the API call itself.
ureq = { version = "2.10.1", default-features = false, features = ["native-tls"] }
# Vendored on purpose: OpenSSL is compiled into the binary rather than linked
# against whatever the machine has. A release built on an old distribution
# would otherwise need that distribution's libssl (1.1 on Ubuntu 20.04), which
# no current system ships — and the plain, un-bundled CLI binary has no
# AppImage around it to carry one.
native-tls = { version = "0.2", features = ["vendored"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
url = "2.5"
chrono = "0.4"
# For blacklist_regex. Not optional: a URL the user asked never to shorten
# must be refused by the CLI too, not only by the tray.
regex = "1.10"

# Tray only.
tray-icon = { version = "0.19", optional = true }
clipboard-master = { version = "4.0.0", optional = true }
arboard = { version = "3.4.1", optional = true }
notify-rust = { version = "4", optional = true }
device_query = { version = "1", optional = true }
crossbeam-channel = { version = "0.5", optional = true }
# Only the history and update endpoints return JSON; the shortener asks for
# format=simple and parses nothing.
serde_json = { version = "1.0", optional = true }
single-instance = { version = "0.3", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
# Win32_System_Console is for the console reattach in main.rs, which is what
# makes the CLI usable from a shell in a tray-enabled (windows-subsystem)
# build.
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Threading", "Win32_Globalization", "Win32_System_Console"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", optional = true }
glib = { version = "0.18", optional = true }
